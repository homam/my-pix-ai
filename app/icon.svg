<!-- Favicon: gradient tile + sparkle mark. Per-brand swappable (see CLAUDE.md
     "White-label / rebranding"). SVG can't read the CSS theme, so the two
     gradient stops hardcode --color-brand-500 / --color-brand-2-500 from
     app/globals.css — keep them in sync when rebranding. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#tile)"/>
  <!-- Lucide "sparkles" main star, filled white, centered in the tile. -->
  <g transform="translate(5.2 5.2) scale(0.9)">
    <path fill="#fff" d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/>
    <path fill="#fff" d="M19 2.5a.5.5 0 0 1 1 0V4h1.5a.5.5 0 0 1 0 1H20v1.5a.5.5 0 0 1-1 0V5h-1.5a.5.5 0 0 1 0-1H19z"/>
    <path fill="#fff" d="M3.5 16.5a.5.5 0 0 1 1 0V18H6a.5.5 0 0 1 0 1H4.5v1.5a.5.5 0 0 1-1 0V19H2a.5.5 0 0 1 0-1h1.5z"/>
  </g>
</svg>
